<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM MECHAMINDS</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #030713;
      --cyan: #00fbff;
      --pink: #ff00ff;
      --amber: rgb(255, 238, 0);
      --green: #15cdf2;
      --text: #e8f7ff;
      --soft: #b6cfdf;
      --muted: #687e94;
      --glass-light: rgba(57, 231, 255, 0.08);
      --glass-medium: rgba(57, 231, 255, 0.12);
      --glass-dark: rgba(219, 224, 239, 0.7);
    }

    body.light-mode {
      --bg: #f0f4fa;
      --text: #0b1a2a;
      --soft: rgb(145, 178, 222);
      --muted: #4a6a8a;
      --cyan: #0088cc;
      --pink: #d92b6e;
      --amber: #cc8f2a;
      --green: #1fa86a;
      --glass-light: rgba(0, 136, 204, 0.1);
      --glass-medium: rgba(0, 136, 204, 0.15);
      --glass-dark: rgba(240, 244, 250, 0.8);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      line-height: 1.5;
      transition: background 0.5s ease, color 0.5s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(57, 231, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 231, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
      opacity: 1;
    }

    #introOverlay {
      position: fixed;
      inset: 0;
      background: #030713;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #introOverlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .intro-title {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 0.3em;
      text-shadow: 0 0 30px rgba(57, 231, 255, 0.6);
      margin-bottom: 24px;
      animation: introPulse 1.5s infinite alternate;
    }

    .intro-loader {
      width: 200px;
      height: 3px;
      background: rgba(57, 231, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .intro-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      box-shadow: 0 0 15px var(--cyan);
      transition: width 0.05s linear;
    }

    .intro-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      margin-top: 16px;
    }

    @keyframes introPulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .glass {
      background: rgba(9, 18, 34, 0.4);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(57, 231, 255, 0.15);
    }

    nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1280px;
      z-index: 500;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 80px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .nav-logo {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(57, 231, 255, 0.4);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s;
      padding: 6px 12px;
      border-radius: 20px;
      position: relative;
    }

    .nav-links a:hover {
      color: var(--cyan);
    }

    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 140px 24px 80px;
      z-index: 1;
      overflow: hidden;
    }

    .hero-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.6em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 20px;
      padding: 10px 24px;
      border-radius: 60px;
      background: rgba(57, 231, 255, 0.08);
      border: 1px solid rgba(57, 231, 255, 0.2);
    }

    .hero-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(3.8rem, 12vw, 8.5rem);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 28px;
    }

    .hero-title .line2 {
      display: block;
      background: linear-gradient(135deg, var(--cyan), var(--pink), var(--amber));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 1.2rem;
      font-weight: 300;
      color: var(--soft);
      max-width: 560px;
      line-height: 1.8;
      padding: 16px 32px;
      border-radius: 40px;
      background: rgba(57, 231, 255, 0.06);
      border: 1px solid rgba(57, 231, 255, 0.15);
      min-height: 1.4em;
      display: inline-block;
      position: relative;
      letter-spacing: 0.05em;
    }

    .hero-cta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 34px;
    }

    .btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 14px 36px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      border-radius: 60px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), #00ffff);
      color: var(--bg);
      box-shadow: 0 0 30px rgba(57, 231, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-ghost {
      background: rgba(57, 231, 255, 0.08);
      color: var(--cyan);
      border: 1.5px solid rgba(57, 231, 255, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    #games {
      position: relative;
      z-index: 1;
      padding: 80px 48px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game-tabs {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .game-tab {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(57, 231, 255, 0.05);
      color: var(--text);
      border: 1px solid rgba(57, 231, 255, 0.2);
      padding: 12px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .game-tab.active {
      background: linear-gradient(135deg, var(--cyan), #00ffff);
      color: var(--bg);
      border-color: transparent;
      box-shadow: 0 0 30px rgba(57, 231, 255, 0.4);
    }

    .game-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(9, 18, 34, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(57, 231, 255, 0.25);
      border-radius: 40px;
      padding: 28px;
      max-width: 460px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    #gameCanvas {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 2 / 3;
      display: block;
      border-radius: 20px;
      background: #050b1d;
      border: 1px solid rgba(57, 231, 255, 0.3);
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #gameCanvas:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 0 30px rgba(57, 231, 255, 0.35);
    }

    .game-help {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--soft);
      text-align: center;
      text-transform: uppercase;
    }

    .theme-toggle {
      background: rgba(57, 231, 255, 0.1);
      border: 1px solid rgba(57, 231, 255, 0.3);
      border-radius: 60px;
      width: 52px;
      height: 28px;
      display: flex;
      align-items: center;
      padding: 2px;
      cursor: pointer;
      position: relative;
      transition: all 0.4s ease;
      box-shadow: inset 0 0 20px rgba(57, 231, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .toggle-knob {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #00ffff);
      position: absolute;
      left: 3px;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 20px var(--cyan), inset 0 0 10px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .theme-toggle.light .toggle-knob {
      transform: translateX(24px);
      background: linear-gradient(135deg, var(--amber), #ffdc5c);
      box-shadow: 0 0 20px var(--amber), inset 0 0 10px rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 800px) {
      nav {
        flex-direction: column;
        gap: 12px;
      }

      .nav-links {
        flex-wrap: wrap;
        gap: 16px;
      }

      #games {
        padding: 60px 24px;
      }
    }
  </style>
</head>
<body>
  <div id="introOverlay">
    <div class="intro-title">MECHAMINDS</div>
    <div class="intro-loader">
      <div class="intro-bar" id="introBar"></div>
    </div>
    <div class="intro-text" id="introText">INITIALIZING SYSTEM...</div>
  </div>

  <nav class="glass" id="nav">
    <div class="nav-logo">MECHAMINDS</div>
    <ul class="nav-links">
      <li><a href="#hero">Home</a></li>
      <li><a href="#games">Playzone</a></li>
      <li><a href="#team">Team</a></li>
    </ul>
    <div class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <div class="toggle-knob">●</div>
    </div>
  </nav>

  <section id="hero">
    <div class="hero-eyebrow">TEAM MECHAMINDS</div>
    <h1 class="hero-title">
      <span class="line1">NEXT GEN</span>
      <span class="line2">PLAY ZONE</span>
    </h1>
    <div class="hero-sub">NRL SIM is now the featured launch experience in the Playzone.</div>
    <div class="hero-cta">
      <a href="#games" class="btn btn-primary">Enter Arena</a>
      <a href="#team" class="btn btn-ghost">Meet Crew</a>
    </div>
  </section>

  <section id="games">
    <div class="game-tabs">
      <button class="game-tab active" type="button">NRL SIM</button>
    </div>

    <div class="game-frame">
      <a href="https://www.youtube.com/@mechaminds" target="_blank" rel="noopener noreferrer" aria-label="Open NRL SIM">
        <img id="gameCanvas" src="voltixy.png" alt="NRL SIM cover image" />
      </a>
      <div class="game-help">Click image to launch NRL SIM</div>
    </div>
  </section>

  <script>
    const introOverlay = document.getElementById('introOverlay');
    const introBar = document.getElementById('introBar');
    const introText = document.getElementById('introText');
    const themeToggle = document.getElementById('themeToggle');

    let fill = 0;
    const interval = setInterval(() => {
      fill += 6;
      introBar.style.width = fill + '%';
      if (fill >= 100) {
        clearInterval(interval);
        introText.textContent = 'SYSTEM ONLINE';
        setTimeout(() => {
          introOverlay.classList.add('fade-out');
        }, 500);
      }
    }, 60);

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      themeToggle.classList.toggle('light');
    });
  </script>
</body>
</html>
